[project]
name = "smart-nepal-guide-backend"
version = "0.1.0"
description = "Bato: Smart Nepal Tourist & Trek Guide - FastAPI backend"
authors = [
    { name = "Aaron Shasankar Bishwakarma", email = "aaronshasankar@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "bcrypt>=5.0.0",
    "fastapi>=0.162.0",
    "google-auth>=2.62.1",
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "pydantic[email]>=2.14.3",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.33",
    "requests>=2.34.2",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]


[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "ruff>=0.17.3",
]
ml = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "scikit-learn>=1.9.1",
]

[tool.uv]
package = false
# "ml" (scikit-learn, matplotlib, ipykernel) is only for evaluation, not for serving the API.
default-groups = ["dev", "ml"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
